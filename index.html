<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Play Monopoly in your browser — pass-and-play with friends or against CPU opponents." />
    <meta name="theme-color" content="#0f3d2e" />
    <title>Web Monopoly</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monopoly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="app">
      <section id="board-wrap">
        <div id="board">
          <div id="center">
            <div class="brand" title="Psst… I'm ticklish.">WEB<br />MONOPOLY</div>
            <div id="dice" aria-label="Dice"></div>
            <ul id="ticker" aria-hidden="true"></ul>
            <div id="prompt" aria-live="polite"></div>
            <div id="tools" hidden>
              <span id="tools-who"></span>
              <button id="btn-manage" class="ghost">🏗️ Manage</button>
              <button id="btn-trade" class="ghost">🤝 Trade</button>
            </div>
            <div id="pot"></div>
            <div id="event"></div>
          </div>
        </div>
      </section>

      <div id="dock"></div>

      <aside id="side">
        <div id="players"></div>
        <div class="log-wrap">
          <div class="log-head"><h3>Game log</h3><span id="round"></span></div>
          <ul id="log"></ul>
        </div>
        <div id="menu">
          <label>Speed
            <select id="speed">
              <option value="slow">Slow</option>
              <option value="normal">Normal</option>
              <option value="fast">Fast</option>
              <option value="instant">Instant</option>
            </select>
          </label>
          <button id="btn-rules" class="ghost">Rules</button>
          <button id="btn-end" class="ghost">End game</button>
          <button id="btn-new" class="ghost">New game</button>
        </div>
      </aside>
    </main>

    <div id="modal" hidden></div>
    <div id="toast" role="status"></div>

    <template id="rules-tpl">
      <ul class="rules">
        <li>Everyone starts with the chosen cash. Roll the dice and move round the board; passing <b>GO</b> pays £200.</li>
        <li>Land on unowned property to buy it. If you pass, it goes to <b>auction</b> (when enabled).</li>
        <li>Landing on someone else's property costs rent. Owning a whole colour set doubles rent on undeveloped sites.</li>
        <li>With a full set (none mortgaged) you can build houses evenly, then hotels, via <b>Manage</b>.</li>
        <li>Rolling doubles gives another roll — but three doubles in a row sends you to Jail.</li>
        <li>In Jail: roll doubles, pay £50 or use a Get Out of Jail Free card. After three failed rolls you must pay.</li>
        <li>Short of cash? Sell buildings (half price) or mortgage property (half its price, 10% interest to repay).</li>
        <li>Use <b>Trade</b> to swap property, Get Out of Jail Free cards and cash with other players. CPUs judge offers on their merits.</li>
        <li>If you can't pay a debt you're bankrupt. The last player standing wins.</li>
        <li>The game saves automatically at the end of every turn. <kbd>Enter</kbd> triggers the highlighted button.</li>
      </ul>
      <p class="small rules-psst">🎩 Psst… Rich Uncle Pennybags keeps a little something for anyone who gives the dice a few quick taps.</p>
    </template>

    <script src="js/data.js"></script>
    <script src="js/game.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
